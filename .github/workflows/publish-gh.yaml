name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # pen-turtle's tests require @mitchallen/pen-svg, which resolves from
      # GitHub Packages along with its own @mitchallen dependency chain.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Floor is 22: coverage uses node:test's --test-coverage-* thresholds,
        # which need Node 22.8+. (Node 20 reached end of life in April 2026.)
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Authenticate to GitHub Packages without setup-node's registry-url/scope
      # inputs, which write a scope mapping that breaks npm ci.
      - run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs every package's tests and fails unless each is at 100% coverage.
      - run: npm run coverage --workspaces

      # Runs after coverage so it proves the "files" allowlists keep generated
      # test output out of the tarballs.
      - run: make pack-check

  publish:
    name: Publish workspace packages
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Authenticate to GitHub Packages without setup-node's registry-url/scope
      # inputs, which write a scope mapping that breaks npm ci.
      - run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs every package's tests and fails unless each is at 100% coverage.
      - run: npm run coverage --workspaces

      # Runs after coverage so it proves the "files" allowlists keep generated
      # test output out of the tarballs.
      - run: make pack-check

      # Each package's publishConfig.registry points at GitHub Packages.
      # Versions come from the manifests; this workflow deliberately does not
      # bump them, unlike the lerna flow it replaces, which auto-versioned on
      # every merge. A release usually bumps only some packages, so publish
      # each workspace whose version isn't on the registry yet and skip the
      # rest; `npm publish --workspaces` would stop at the first one already
      # published. A failed lookup (e.g. auth) prints nothing and falls
      # through to publish, which then fails loudly rather than skipping.
      - name: Publish
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if [ "$(node -p "!!require('./${dir}package.json').private")" = "true" ]; then
              echo "skip $name (private)"
            elif [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "skip $name@$version (already published)"
            else
              npm publish --workspace="${dir%/}"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
