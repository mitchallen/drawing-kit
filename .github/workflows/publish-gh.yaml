name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # pen-turtle's tests require @mitchallen/pen-svg, which resolves from
      # GitHub Packages along with its own @mitchallen dependency chain.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Floor is 20: the toolchain pulls brace-expansion@5 (node "20 || >=22")
        # and serialize-javascript@7 (node >=20).
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Authenticate to GitHub Packages without setup-node's registry-url/scope
      # inputs, which write a scope mapping that breaks npm ci.
      - run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs every package's tests and fails unless each is at 100% coverage.
      - run: npm run coverage --workspaces

  publish:
    name: Publish workspace packages
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # Authenticate to GitHub Packages without setup-node's registry-url/scope
      # inputs, which write a scope mapping that breaks npm ci.
      - run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs every package's tests and fails unless each is at 100% coverage.
      - run: npm run coverage --workspaces

      # Each package's publishConfig.registry points at GitHub Packages, and
      # --workspaces skips the private root and the private examples. Versions
      # come from the manifests; this workflow deliberately does not bump them,
      # unlike the lerna flow it replaces, which auto-versioned on every merge.
      - name: Publish
        run: npm publish --workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
