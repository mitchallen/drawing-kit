name: Checks
run-name: Checks by ${{ github.actor }}

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read
  # pen-turtle's tests require @mitchallen/pen-svg, which resolves from
  # GitHub Packages along with its own @mitchallen dependency chain.
  packages: read

jobs:
  checks:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is 20: the toolchain pulls brace-expansion@5 (node "20 || >=22")
        # and serialize-javascript@7 (node >=20).
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The committed .npmrc already maps @mitchallen to GitHub Packages; this
      # only adds the token, which npm expands from the env at install time.
      # (setup-node's registry-url/scope inputs would rewrite that mapping.)
      - name: Authenticate to GitHub Packages
        run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test --workspaces
